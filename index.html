<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анимированное дерево на чистом CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="intro">
        <h1>Анимированное дерево</h1>
        <p>Простая анимация на чистом CSS: дерево растёт, листья распускаются, цветы и плоды появляются по очереди. Наведите курсор на дерево, чтобы увидеть эффект лёгкого покачивания.</p>
    </div>

    <div class="canvas">
        <div class="tree">
            <div class="trunk">

                <div class="branch">
                    <div class="leaf"></div>
                    <div class="leaf"></div>
                    <div class="leaf"></div>
                    <div class="flower"></div>
                    <div class="fruit"><div class="stem"></div></div>
                </div>

                <div class="branch">
                    <div class="leaf"></div>
                    <div class="leaf"></div>
                    <div class="leaf"></div>
                    <div class="flower"></div>
                    <div class="fruit"><div class="stem"></div></div>
                </div>

                <div class="branch">
                    <div class="leaf"></div>
                    <div class="leaf"></div>
                    <div class="leaf"></div>
                    <div class="flower"></div>
                    <div class="fruit"><div class="stem"></div></div>
                </div>

                <div class="branch">
                    <div class="leaf"></div>
                    <div class="leaf"></div>
                    <div class="leaf"></div>
                    <div class="flower"></div>
                    <div class="fruit"><div class="stem"></div></div>
                </div>

                <div class="branch">
                    <div class="leaf"></div>
                    <div class="leaf"></div>
                    <div class="leaf"></div>
                    <div class="flower"></div>
                    <div class="fruit"><div class="stem"></div></div>
                </div>

                <div class="branch">
                    <div class="leaf"></div>
                    <div class="leaf"></div>
                    <div class="leaf"></div>
                    <div class="flower"></div>
                    <div class="fruit"><div class="stem"></div></div>
                </div>

                <div class="branch">
                    <div class="leaf"></div>
                    <div class="leaf"></div>
                    <div class="leaf"></div>
                    <div class="flower"></div>
                    <div class="fruit"><div class="stem"></div></div>
                </div>

                <div class="branch">
                    <div class="leaf"></div>
                    <div class="leaf"></div>
                    <div class="leaf"></div>
                    <div class="flower"></div>
                    <div class="fruit"><div class="stem"></div></div>
                </div>

            </div>
        </div>
    </div>

    <div class="outro">
        <p>Дерево выращено с помощью <strong>@keyframes</strong>, <strong>transform</strong> и <strong>animation</strong> — без единой строчки JavaScript.</p>
    </div>

</body>
</html>
